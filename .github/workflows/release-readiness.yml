name: Release readiness (offline CLI)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-cli:
    name: ${{ matrix.os }} / offline CLI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Prepare managed artifacts and library online
        shell: bash
        run: |
          set -euo pipefail
          export ECONPAPERS_CONFIG_DIR="$RUNNER_TEMP/release-config"
          export ECONPAPERS_LIBRARY_DIR="$RUNNER_TEMP/release-library"
          echo "ECONPAPERS_CONFIG_DIR=$RUNNER_TEMP/release-config" >> "$GITHUB_ENV"
          echo "ECONPAPERS_LIBRARY_DIR=$RUNNER_TEMP/release-library" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release-config" "$RUNNER_TEMP/release-library"
          econpapers setup --model qwen2.5-1.5b-instruct-q4-k-m
          python .github/scripts/create_release_fixture_pdf.py "$RUNNER_TEMP/release-fixture.pdf"
          econpapers analyze "$RUNNER_TEMP/release-fixture.pdf"
          econpapers status

      - name: Probe network before isolation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/network_probe.py reachable | tee "$RUNNER_TEMP/preflight.txt"

      - name: Run offline CLI scenarios in a network namespace (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          econpapers_bin="$(command -v econpapers)"
          sudo unshare --net -- bash -c '
            set -euo pipefail
            env ECONPAPERS_CONFIG_DIR="$4" ECONPAPERS_LIBRARY_DIR="$5" \
              "$3" "$1/.github/scripts/network_probe.py" blocked
            set +e
            env ECONPAPERS_CONFIG_DIR="$4" ECONPAPERS_LIBRARY_DIR="$5" \
              "$3" "$1/.github/scripts/run_offline_cli.py" "$2" "$6"
            command_status=$?
            set -e
            env ECONPAPERS_CONFIG_DIR="$4" ECONPAPERS_LIBRARY_DIR="$5" \
              "$3" "$1/.github/scripts/network_probe.py" blocked
            exit "$command_status"
          ' bash "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release-fixture.pdf" "$python_bin" "$ECONPAPERS_CONFIG_DIR" "$ECONPAPERS_LIBRARY_DIR" "$econpapers_bin" | tee "$RUNNER_TEMP/offline-cli.txt"

      - name: Run offline CLI scenarios by disabling the default route (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          interface="$(route -n get default | awk '/interface:/{print $2; exit}')"
          test -n "$interface"
          restore_network() {
            sudo ifconfig "$interface" up || true
          }
          trap restore_network EXIT
          sudo ifconfig "$interface" down
          python .github/scripts/network_probe.py blocked
          set +e
          python .github/scripts/run_offline_cli.py "$RUNNER_TEMP/release-fixture.pdf" | tee "$RUNNER_TEMP/offline-cli.txt"
          command_status=${PIPESTATUS[0]}
          set -e
          python .github/scripts/network_probe.py blocked
          exit "$command_status"

      - name: Run offline CLI scenarios by disabling the default adapter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $adapter = Get-NetIPConfiguration |
            Where-Object { $_.IPv4DefaultGateway -ne $null -and $_.NetAdapter.Status -eq 'Up' } |
            Select-Object -First 1
          if ($null -eq $adapter) {
            throw 'Could not identify the active default network adapter.'
          }
          $alias = $adapter.InterfaceAlias
          Disable-NetAdapter -Name $alias -Confirm:$false
          try {
            python .github/scripts/network_probe.py blocked
            $offlineExit = 0
            python .github/scripts/run_offline_cli.py "$env:RUNNER_TEMP/release-fixture.pdf" 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP/offline-cli.txt"
            $offlineExit = $LASTEXITCODE
            python .github/scripts/network_probe.py blocked
            if ($offlineExit -ne 0) { exit $offlineExit }
          } finally {
            Enable-NetAdapter -Name $alias -Confirm:$false
          }

      - name: Probe network after the command suite
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/network_probe.py reachable | tee "$RUNNER_TEMP/postflight.txt"

      - name: Upload offline-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-cli-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/preflight.txt
            ${{ runner.temp }}/offline-cli.txt
            ${{ runner.temp }}/postflight.txt
          if-no-files-found: warn
