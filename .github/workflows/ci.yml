name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          # Pinned to an exact patch satisfying pyproject.toml's >=3.10.12
          # floor (safe tarfile extraction, PEP 706 filter="data", used by
          # managed runtime provisioning, issue #58) — the bare "3.10" minor
          # spec resolves to whatever actions/setup-python has cached, which
          # on some runners is still 3.10.11.
          - "3.10.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Verify installed CLI
        run: econpapers --help

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest
